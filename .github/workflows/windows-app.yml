# Build HANA MEDIA cho Windows mỗi lần cập nhật main (tải ở tab Actions → Artifacts).
# Mỗi lần cập nhật main: tự đánh số phiên bản 1.1.<số lần build> và đăng bộ cài lên mục Releases;
# app đã cài thấy "Có bản mới" và tự cập nhật từ đó (runner/updater.py). Đẩy tag v* thì dùng đúng số của tag.
name: Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: python -m pip install -r requirements-app.txt
      - name: Kiểm thử
        run: python -m unittest discover -s tests
      - name: Đặt số phiên bản
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "1.1.${{ github.run_number }}" }
          $file = "runner/version.py"
          $text = (Get-Content $file -Raw -Encoding utf8) -replace 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$v`""
          [IO.File]::WriteAllText((Resolve-Path $file), $text, (New-Object Text.UTF8Encoding $false))
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Phiên bản: $v"
      - name: Đóng gói app
        run: python -m PyInstaller --noconfirm --clean packaging/HanaMedia.spec
      - name: Kiểm tra thư viện trong bản đóng gói (Selenium, Chrome, cửa sổ app)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\self-check.txt"
          $p = Start-Process dist\HanaMedia\HanaMedia.exe -ArgumentList "--self-check", $out -PassThru -Wait
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "HanaMedia.exe thiếu thư viện (xem lỗi phía trên)" }
      - name: Kiểm tra app khởi động
        shell: pwsh
        run: |
          $env:HANAMEDIA_DATA = "$env:RUNNER_TEMP\hana-data"
          $p = Start-Process dist\HanaMedia\HanaMedia.exe -ArgumentList "--server-only" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 1
            try { $r = Invoke-WebRequest http://127.0.0.1:8765/api/state -UseBasicParsing; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "HanaMedia.exe không khởi động được" }
      - name: Tạo bộ cài
        shell: pwsh
        run: |
          $version = python -c "from runner.version import APP_VERSION; print(APP_VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\HanaMedia.iss
      - uses: actions/upload-artifact@v4
        with:
          name: HanaMedia-Setup
          path: dist/HanaMedia-Setup-*.exe
      - name: Đăng lên Releases (bản tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HanaMedia-Setup-*.exe
      - name: Đăng bản cập nhật lên Releases (mỗi lần cập nhật main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HANA MEDIA ${{ steps.version.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: dist/HanaMedia-Setup-*.exe
