# Build HANA MEDIA cho Windows (.exe) và macOS (.dmg) mỗi lần cập nhật main (tải ở tab Actions → Artifacts).
# Mỗi lần cập nhật main: tự đánh số phiên bản 1.1.<số lần build> và đăng bộ cài lên mục Releases;
# app đã cài thấy "Có bản mới" và tự cập nhật từ đó (runner/updater.py). Đẩy tag v* thì dùng đúng số của tag.
name: Windows app
# (Cùng workflow có job macOS: cùng số phiên bản, file .dmg đăng chung Release với bộ cài Windows.)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: python -m pip install -r requirements-app.txt
      - name: Kiểm thử
        run: python -m unittest discover -s tests
      - name: Đặt số phiên bản
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "1.1.${{ github.run_number }}" }
          $file = "runner/version.py"
          $text = (Get-Content $file -Raw -Encoding utf8) -replace 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$v`""
          [IO.File]::WriteAllText((Resolve-Path $file), $text, (New-Object Text.UTF8Encoding $false))
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Phiên bản: $v"
      - name: Khóa Gemini cho chatbot hỗ trợ (GitHub Secret)
        env:
          SUPPORT_KEY: ${{ secrets.SUPPORT_GEMINI_API_KEY }}
        run: python packaging/write_support_key.py
      - name: Đóng gói app
        run: python -m PyInstaller --noconfirm --clean packaging/HanaMedia.spec
      - name: Kiểm tra thư viện trong bản đóng gói (Selenium, Chrome, cửa sổ app)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\self-check.txt"
          $p = Start-Process dist\HanaMedia\HanaMedia.exe -ArgumentList "--self-check", $out -PassThru -Wait
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "HanaMedia.exe thiếu thư viện (xem lỗi phía trên)" }
      - name: Kiểm tra app khởi động
        shell: pwsh
        run: |
          $env:HANAMEDIA_DATA = "$env:RUNNER_TEMP\hana-data"
          $p = Start-Process dist\HanaMedia\HanaMedia.exe -ArgumentList "--server-only" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 1
            try { $r = Invoke-WebRequest http://127.0.0.1:8765/api/state -UseBasicParsing; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "HanaMedia.exe không khởi động được" }
      - name: Tạo bộ cài
        shell: pwsh
        run: |
          $version = python -c "from runner.version import APP_VERSION; print(APP_VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\HanaMedia.iss
      - name: Mã SHA-256 của bộ cài (app kiểm tra khi tự cập nhật)
        shell: pwsh
        run: |
          Get-ChildItem dist\HanaMedia-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -NoNewline -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: HanaMedia-Setup
          path: dist/HanaMedia-Setup-*.exe
      - name: Đăng lên Releases (bản tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HanaMedia-Setup-*.exe
      - name: Đăng bản cập nhật lên Releases (mỗi lần cập nhật main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: HANA MEDIA ${{ steps.version.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            dist/HanaMedia-Setup-*.exe
            dist/HanaMedia-Setup-*.exe.sha256

  mac:
    # Bản macOS: chip Apple (M1/M2/M3/M4) và chip Intel, mỗi loại một file .dmg riêng.
    # Chưa ký Apple Developer ID: lần đầu mở cần chuột phải → Mở (hoặc Cài đặt → Quyền riêng tư & Bảo mật → Vẫn mở).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            suffix: mac
          - runner: macos-15-intel
            suffix: mac-intel
            # cryptography từ bản 49 không còn gói dựng sẵn cho Mac Intel: pip tự build từ mã nguồn,
            # liên kết với OpenSSL của máy build, lệch với OpenSSL trong app → app không mở được.
            # Giữ bản 48 (gói universal2 dựng sẵn) và cấm build từ mã nguồn.
            pin: "cryptography>=42,<49"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          if [ -n "${{ matrix.pin }}" ]; then
            python -m pip install --only-binary=cryptography "${{ matrix.pin }}" -r requirements-app.txt
          else
            python -m pip install -r requirements-app.txt
          fi
      - name: Kiểm thử
        run: python -m unittest discover -s tests
      - name: Đặt số phiên bản
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="1.1.${{ github.run_number }}"; fi
          python - "$v" <<'PY'
          import re, sys
          from pathlib import Path
          f = Path("runner/version.py")
          f.write_text(re.sub(r'APP_VERSION = "[^"]*"', f'APP_VERSION = "{sys.argv[1]}"', f.read_text(encoding="utf-8")), encoding="utf-8")
          PY
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Phiên bản: $v"
      - name: Biểu tượng app (.icns)
        run: python -c "from PIL import Image; Image.open('web/logo.png').convert('RGBA').resize((1024, 1024), Image.LANCZOS).save('packaging/hanamedia.icns')"
      - name: Khóa Gemini cho chatbot hỗ trợ (GitHub Secret)
        env:
          SUPPORT_KEY: ${{ secrets.SUPPORT_GEMINI_API_KEY }}
        run: python packaging/write_support_key.py
      - name: Đóng gói app
        run: python -m PyInstaller --noconfirm --clean packaging/HanaMedia.spec
      - name: Kiểm tra thư viện trong bản đóng gói (Selenium, Chrome, cửa sổ app)
        run: |
          out="$RUNNER_TEMP/self-check.txt"
          set +e
          dist/HanaMedia.app/Contents/MacOS/HanaMedia --self-check "$out"
          code=$?
          set -e
          cat "$out"
          test $code -eq 0
      - name: Kiểm tra app khởi động
        run: |
          export HANAMEDIA_DATA="$RUNNER_TEMP/hana-data"
          dist/HanaMedia.app/Contents/MacOS/HanaMedia --server-only &
          pid=$!
          ok=0
          for i in $(seq 1 40); do
            sleep 1
            if curl -fsS http://127.0.0.1:8765/api/state >/dev/null 2>&1; then ok=1; break; fi
          done
          kill $pid || true
          test $ok -eq 1
      - name: Ký ad-hoc và tạo file .dmg
        run: |
          codesign --force --deep --sign - dist/HanaMedia.app
          v="${{ steps.version.outputs.version }}"
          mkdir -p dmg
          cp -R dist/HanaMedia.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "HANA MEDIA" -srcfolder dmg -ov -format UDZO "dist/HanaMedia-$v-${{ matrix.suffix }}.dmg"
          (cd dist && shasum -a 256 "HanaMedia-$v-${{ matrix.suffix }}.dmg" > "HanaMedia-$v-${{ matrix.suffix }}.dmg.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: HanaMedia-${{ matrix.suffix }}
          path: |
            dist/HanaMedia-*-${{ matrix.suffix }}.dmg
            dist/HanaMedia-*-${{ matrix.suffix }}.dmg.sha256
    outputs:
      version: ${{ steps.version.outputs.version }}

  release-mac:
    # Đăng file .dmg vào cùng Release với bộ cài Windows (sau khi job Windows đã tạo Release).
    needs: [build, mac]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HanaMedia-mac*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.mac.outputs.version }}
          files: |
            dist/HanaMedia-*-mac*.dmg
            dist/HanaMedia-*-mac*.dmg.sha256
